; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; [env:native] is host-only (unit tests), never a firmware target: keep it
; out of the default `pio run` set so a plain build/upload only targets the
; real board. Use `pio test -e native` explicitly to run the unit tests.
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
framework = arduino
board = nodemcuv2
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    prampec/IotWebConf@^3.2.1
build_flags =
    -std=gnu++11
; Unit tests are host-side only (see [env:native]); this test stubs out
; Arduino.h, which conflicts with the real framework headers if PlatformIO
; ever tries to build it for actual hardware.
test_ignore = test_sml_parser

[env:native]
platform = native
build_flags =
    -std=gnu++11
    -DUNITY_INCLUDE_DOUBLE
    -DNATIVE_TEST
    -I test/test_sml_parser
    -I include
test_build_src = false
